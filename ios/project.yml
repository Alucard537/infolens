        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.infolens.visor
            CFBundleURLSchemes: [infolens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infolens.visor
        MARKETING_VERSION: "0.14.0"
        CURRENT_PROJECT_VERSION: "28"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
