name: InfoLensVisor
options:
  bundleIdPrefix: com.infolens
  deploymentTarget:
    iOS: "16.0"
targets:
  InfoLensVisor:
    type: application
    platform: iOS
    sources:
      - InfoLensVisor
      - path: web-integrada
        type: folder
        buildPhase: resources
    info:
      path: InfoLensVisor/Info.plist
      properties:
        CFBundleDisplayName: InfoLens
        CFBundleShortVersionString: "0.14.0"
        CFBundleVersion: "28"
