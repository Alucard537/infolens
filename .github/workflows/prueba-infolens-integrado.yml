name: Compilar InfoLens integrado
on:
  push:
    branches: [prueba-infolens-integrado]
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compilar la web incluida
        run: |
          npm ci
          npm run build -- --outDir ios/web-integrada
          test -s ios/web-integrada/index.html
          test -s ios/web-integrada/modelos/magic_touch.tflite
      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Comprobar el recorrido de prueba y los enlaces
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infolens-smoke"
          cat > "$RUNNER_TEMP/infolens-smoke/main.swift" <<'SWIFT'
          import simd
          import Foundation
          let demo = Recorrido.prueba()
          precondition(demo.textoQR == "INFOLENS:TEST-1")
          precondition(demo.modulos?.count == 21 && demo.modulos?.first?.count == 21)
          let url = URL(string: "infolens://ruta?d=%7B%22p%22%3A%5B%5B0%2C0%2C0%5D%2C%5B0%2C0%2C-1%5D%2C%5B0.5%2C0%2C-1%5D%5D%2C%22i%22%3A%7B%22nombre%22%3A%22Destino%20de%20prueba%22%7D%2C%22a%22%3A%22TEST-1%22%2C%22l%22%3A10%2C%22v%22%3A%22flechas%22%2C%22c%22%3A%22suelo%22%2C%22g%22%3A45%2C%22q%22%3A%2221%3Afea3fc14d06e94bb7505dba52ec10d07faafe01f00b75a5b8dc393c443aaa3a3a6dd004b8bfa64f05c1bba4bfdd53baeb25104e64fe80b0%22%7D")!
          guard let ruta = Recorrido.desdeURL(url) else { fatalError("No se pudo abrir el enlace desde Safari") }
          precondition(ruta.puntos == demo.puntos && ruta.modulos == demo.modulos)
          precondition(ruta.ladoCm == demo.ladoCm && ruta.info.nombre == demo.info.nombre)
          precondition(Recorrido.desdeURL(URL(string: "infolens://ruta")!) == nil)
          print("QR de prueba y enlace de Safari verificados")
          let giro = simd_quatf(angle: 27 * .pi / 180, axis: SIMD3<Float>(0, 1, 0))
          let centro = SIMD3<Float>(0.4, 0.6, -0.9)
          func pose(_ q: simd_quatf, centro: SIMD3<Float>) -> PoseQR {
              var matriz = simd_float4x4(q)
              matriz.columns.3 = SIMD4<Float>(centro, 1)
              return PoseQR(matriz)
          }
          func ejes(_ inclinacion: Float, delante: Float) {
              let inclinada = giro * simd_quatf(angle: inclinacion, axis: SIMD3<Float>(1, 0, 0))
              let marco = pose(inclinada, centro: centro).marcoInicialRecorrido!
              let adelante = marco * SIMD4<Float>(0, 0, -1, 0)
              let derecha = marco * SIMD4<Float>(1, 0, 0, 0)
              precondition(simd_distance(SIMD3<Float>(adelante.x, adelante.y, adelante.z), giro.act([0, 0, delante])) < 0.0001)
              precondition(simd_distance(SIMD3<Float>(derecha.x, derecha.y, derecha.z), giro.act([-delante, 0, 0])) < 0.0001)
              precondition(marco.columns.1 == SIMD4<Float>(0, 1, 0, 0))
              precondition(marco.columns.3 == SIMD4<Float>(centro, 1))
          }
          ejes(0, delante: -1)
          ejes(0.3, delante: -1)
          ejes(.pi / 2, delante: -1)
          ejes(.pi, delante: 1)
          let a = pose(giro, centro: centro)
          let cercano = pose(giro, centro: centro + [0.02, 0, 0])
          precondition(a.cercana(a: cercano))
          precondition(!a.cercana(a: pose(giro, centro: centro + [0.08, 0, 0])))
          precondition(simd_distance(a.combinada(con: cercano, peso: 0.5).posicion, centro + [0.01, 0, 0]) < 0.0001)
          print("Ejes del recorrido comprobados en suelo, inclinado, pared y techo")
          func comprobarMovimiento(inicial: simd_quatf, eje: SIMD3<Float>) {
              let id = UUID()
              var anclaje = AnclajeQR()
              let original = pose(inicial, centro: centro)
              for i in 0..<5 {
                  precondition(anclaje.observar(original, id: id, en: 1 + 0.05 * Double(i)) == nil)
              }
              precondition(anclaje.observar(original, id: id, en: 1.26) != nil)
              let local = anclaje.rutaDesdeQR!
              let rutaInicial = original.matriz * local
              let destino = SIMD4<Float>(0.5, 0, -1, 1)
              let cuartoDeVuelta = simd_quatf(angle: .pi / 2, axis: eje)
              let traslado = SIMD3<Float>(0.31, 0.08, 0.23)
              let movida = pose(cuartoDeVuelta * inicial, centro: centro + traslado)
              // ARKit puede indicar una escala distinta para el papel. Los ejes deben seguir siendo unitarios.
              var medida = movida.matriz
              medida.columns.0 *= 1.3
              medida.columns.1 *= 1.3
              medida.columns.2 *= 1.3
              guard let actual = anclaje.observar(PoseQR(medida), id: id, en: 1.29) else {
                  fatalError("El movimiento debe aplicarse en el primer fotograma")
              }
              let centroQR = actual.matriz * SIMD4<Float>(0, 0, 0, 1)
              let punta = actual.matriz * SIMD4<Float>(0, 0, -0.064, 1)
              let superior = (cuartoDeVuelta * inicial).act([0, 0, -0.064])
              precondition(simd_distance(SIMD3<Float>(centroQR.x, centroQR.y, centroQR.z), centro + traslado) < 0.0001)
              let flecha = punta - centroQR
              precondition(simd_distance(SIMD3<Float>(flecha.x, flecha.y, flecha.z), superior) < 0.0001)
              let puntoInicial = rutaInicial * destino
              let desplazamiento = SIMD3<Float>(puntoInicial.x, puntoInicial.y, puntoInicial.z) - centro
              let esperado = centro + traslado + cuartoDeVuelta.act(desplazamiento)
              let puntoActual = anclaje.pose!.matriz * local * destino
              precondition(simd_distance(SIMD3<Float>(puntoActual.x, puntoActual.y, puntoActual.z), esperado) < 0.0001)

              // Reaparece el mismo QR en la pose original. Conserva la ?ltima pose hasta verificarlo.
              precondition(anclaje.observar(original, id: id, en: 4) == nil)
              precondition(anclaje.pose!.cercana(a: movida))
              for i in 1..<5 {
                  precondition(anclaje.observar(original, id: id, en: 4 + 0.05 * Double(i)) == nil)
              }
              precondition(anclaje.observar(original, id: id, en: 4.26) != nil)
              let recuperado = anclaje.pose!.matriz * anclaje.rutaDesdeQR! * destino
              precondition(simd_distance(recuperado, puntoInicial) < 0.0001)

              anclaje.dejarDeVerQR()
              let idNuevo = UUID()
              precondition(anclaje.observar(movida, id: idNuevo, en: 5) == nil)
              precondition(anclaje.pose!.cercana(a: original))
          }
          comprobarMovimiento(inicial: giro, eje: [0, 1, 0])
          comprobarMovimiento(inicial: simd_quatf(angle: .pi / 2, axis: [1, 0, 0]), eje: [0, 0, 1])
          print("El QR transmite 90 grados al destino y conserva su pose si sale de c?mara")
          let mensaje = Data("""
          {"p":[[0,0,0],[0,0,-1],[0.3,0,-1]],"a":"ANCLA-REAL-1","l":8,"v":"linea","flechas":false,"icono":true,"posIcono":[0.3,0.2,-1]}
          """.utf8)
          guard let integrado = Recorrido.desdeDatos(mensaje) else { fatalError("Mensaje de ARKit inv?lido") }
          precondition(integrado.anclaId == "ANCLA-REAL-1" && integrado.ladoCm == 8)
          precondition(integrado.soloLinea && !integrado.flechas && integrado.icono)
          precondition(integrado.posIcono == SIMD3<Float>(0.3,0.2,-1))
          let forma = GeometriaFlecha.verticesYNormales()
          precondition(forma.vertices.count == 72 && forma.normales.count == 72 && forma.materiales.count == 24)
          precondition(forma.vertices.map(\.z).min()! == -0.185 && forma.vertices.map(\.z).max()! == 0.135)
          precondition(forma.vertices.map(\.y).max()! - forma.vertices.map(\.y).min()! > 0.03)
          precondition(Set(forma.materiales) == Set<UInt32>([0, 1]))
          precondition(forma.normales.allSatisfy { abs(simd_length($0) - 1) < 0.0001 })
          precondition(GeometriaFlecha.escala(profundidad: 0.08, altoPantalla: 820, anchoPantalla: 390, proyeccionY: 1.6) == 0)
          let escalaVisible = GeometriaFlecha.escala(profundidad: 0.5, altoPantalla: 820, anchoPantalla: 390, proyeccionY: 1.6)
          precondition(escalaVisible < 1 && escalaVisible > 0.2)
          let carga = Data("""
          {"id":"INFOLENS-SUB:S-123456789abc","ladoCm":9,"subancla":{"anclaId":"PRINCIPAL","nombre":"Lateral","cara":"derecha","pos":[4,0.8,-2]}}
          """.utf8)
          let referencia = try JSONDecoder().decode(AnclaAR.self, from: carga)
          precondition(referencia.valida && referencia.principalId == "PRINCIPAL" && referencia.textoQR == referencia.id)
          for (cara, normal, derecha) in [
              (SubanclaAR.Cara.frontal, SIMD3<Float>(0,0,1), SIMD3<Float>(1,0,0)),
              (.derecha, SIMD3<Float>(1,0,0), SIMD3<Float>(0,0,-1)),
              (.trasera, SIMD3<Float>(0,0,-1), SIMD3<Float>(-1,0,0)),
              (.izquierda, SIMD3<Float>(-1,0,0), SIMD3<Float>(0,0,1))
          ] {
              let punto = SIMD3<Float>(4, 0.8, -2)
              let subancla = SubanclaAR(anclaId: "PRINCIPAL", nombre: "Prueba", pos: [punto.x, punto.y, punto.z], cara: cara)
              let marcaEnRecorrido = simd_float4x4(columns: (
                  SIMD4<Float>(derecha, 0), SIMD4<Float>(normal, 0), SIMD4<Float>(0,-1,0,0), SIMD4<Float>(punto, 1)
              ))
              for giro in [Float(0), .pi / 2, -.pi / 3] {
                  var marco = simd_float4x4(simd_quatf(angle: giro, axis: [0, 1, 0]))
                  marco.columns.3 = [2.7, 1.15, -4, 1]
                  let recuperado = subancla.poseRecorrido(desde: PoseQR(marco * marcaEnRecorrido))
                  precondition(recuperado.cercana(a: PoseQR(marco), metros: 0.0001, grados: 0.10))
              }
          }
          var avanceDesdeSubancla = ProgresoRuta()
          let itinerario: [SIMD3<Float>] = [[0,0,0],[0,0,-2],[4,0,-2],[4,0,-4]]
          avanceDesdeSubancla.ubicarTramo(puntos: itinerario, posicion: [3,1.7,-2.15])
          precondition(avanceDesdeSubancla.indice == 2)
          precondition(!avanceDesdeSubancla.actualizar(puntos: itinerario, posicion: [3,1.7,-2.15]).llegada)
          let colocacionDatos = Data("""
          {"a":"PRINCIPAL","l":10,"p":[[0,0,0],[-4.005,-0.8,2]],"i":{"nombre":"Punto lateral","referencia":"Lateral derecho"},"colocacion":{"cara":"derecha","ladoCm":9},"flechas":true,"icono":false,"posIcono":[0,1,0]}
          """.utf8)
          let colocacion = Recorrido.desdeDatos(colocacionDatos)!
          precondition(colocacion.anclaId == "PRINCIPAL" && colocacion.ancla.subancla == nil)
          precondition(colocacion.puntos == [[0,0,0],[-4.005,-0.8,2]])
          precondition(colocacion.colocacion?.cara == .derecha && colocacion.colocacion?.ladoCm == 9)
          precondition(!colocacion.flechas && colocacion.icono && colocacion.posIcono == nil)
          precondition(colocacion.colocacion?.cara.ejesMarca.columns.2 == SIMD3<Float>(0,-1,0))
          let fueraDeLimite = String(decoding: colocacionDatos, as: UTF8.self).replacingOccurrences(of: "\"ladoCm\":9", with: "\"ladoCm\":30")
          precondition(Recorrido.desdeDatos(Data(fueraDeLimite.utf8)) == nil)
          let objetivo = colocacion.puntos[1]
          precondition(colocacion.colocacion!.seVe(desde: objetivo + [1,0,0], punto: objetivo))
          precondition(!colocacion.colocacion!.seVe(desde: objetivo - [1,0,0], punto: objetivo))
          precondition(!colocacion.colocacion!.seVe(desde: objetivo + [0,0,1], punto: objetivo))
          precondition(DireccionDestino.enPantalla(x: 0.5, y: 0.5) == nil)
          precondition(DireccionDestino.enPantalla(x: -0.2, y: 0.4) == .izquierda)
          precondition(DireccionDestino.enPantalla(x: 1.2, y: 0.4) == .derecha)
          precondition(DireccionDestino.enPantalla(x: 0.5, y: -0.2) == .arriba)
          precondition(DireccionDestino.enPantalla(x: 0.5, y: 1.2) == .abajo)
          precondition(DireccionDestino.fueraDelPlano(lateral: -1, profundidad: -1) == .izquierda)
          precondition(DireccionDestino.fueraDelPlano(lateral: 0, profundidad: -1) == .giro)
          precondition(DireccionDestino.fueraDelPlano(lateral: 0, profundidad: 0.01) == .alejar)
          precondition(Recorrido.prueba().colocacion == nil)
          SWIFT
          xcrun swiftc ios/InfoLensVisor/Recorrido.swift ios/InfoLensVisor/AnclajeQR.swift ios/InfoLensVisor/GeometriaFlecha.swift ios/InfoLensVisor/ProgresoRuta.swift "$RUNNER_TEMP/infolens-smoke/main.swift" -o "$RUNNER_TEMP/infolens-smoke/revisar"
          "$RUNNER_TEMP/infolens-smoke/revisar"
      - name: Comprobar el servidor de recursos incluido
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infolens-servidor"
          cat > "$RUNNER_TEMP/infolens-servidor/main.swift" <<'SWIFT'
          import Foundation
          let servidor = ServidorWeb(raiz: URL(fileURLWithPath: CommandLine.arguments[1]))
          servidor.arrancar { resultado in
              if case .failure(let error) = resultado { fatalError(error.localizedDescription) }
          }
          RunLoop.main.run()
          SWIFT
          xcrun swiftc ios/InfoLensVisor/ServidorWeb.swift "$RUNNER_TEMP/infolens-servidor/main.swift" -o "$RUNNER_TEMP/infolens-servidor/prueba"
          "$RUNNER_TEMP/infolens-servidor/prueba" "$GITHUB_WORKSPACE/ios/web-integrada" &
          servidor_pid=$!
          trap 'kill "$servidor_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:41967/ -o "$RUNNER_TEMP/infolens.html"; then break; fi
            sleep 1
          done
          cmp "$RUNNER_TEMP/infolens.html" ios/web-integrada/index.html
          test "$(curl -sS --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:41967/%2e%2e/project.yml)" = "400"
      - name: Compilar InfoLens para iPhone
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -project InfoLensVisor.xcodeproj -target InfoLensVisor -configuration Release -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/infolens-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/infolens-xcode.log"
      - name: Empaquetar IPA de prueba
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infolens-ipa/Payload"
          cp -R "$RUNNER_TEMP/infolens-build/Release-iphoneos/InfoLensVisor.app" "$RUNNER_TEMP/infolens-ipa/Payload/"
          test -s "$RUNNER_TEMP/infolens-ipa/Payload/InfoLensVisor.app/web-integrada/index.html"
          cd "$RUNNER_TEMP/infolens-ipa"
          zip -qry "$GITHUB_WORKSPACE/InfoLens-Integrado-Prueba.ipa" Payload
          shasum -a 256 "$GITHUB_WORKSPACE/InfoLens-Integrado-Prueba.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: InfoLens-Integrado-Prueba
          path: InfoLens-Integrado-Prueba.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Comprobar el reconocimiento con WebKit y el servidor de InfoLens
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { build } from 'vite';
          await build({ build: {
            outDir: 'ios/web-reconocimiento-prueba',
            rollupOptions: { input: 'scripts/prueba-reconocimiento/index.html' },
          } });
          NODE
          cp ios/web-reconocimiento-prueba/scripts/prueba-reconocimiento/index.html ios/web-reconocimiento-prueba/prueba-reconocimiento.html
          xcrun swiftc ios/InfoLensVisor/ServidorWeb.swift scripts/prueba-reconocimiento/main.swift -o "$RUNNER_TEMP/prueba-reconocimiento"
          "$RUNNER_TEMP/prueba-reconocimiento" "$PWD/ios/web-reconocimiento-prueba"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Log-Xcode-InfoLens
          path: ${{ runner.temp }}/infolens-xcode.log
          if-no-files-found: ignore
